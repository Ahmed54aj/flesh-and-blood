<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silver Age</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/main.css">
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="menu">
    <h1>Silver Age</h1>
    <p id="status">Fetching decklists...</p>
    <div class="pickers">
      <section class="hero-picker" id="picker-you" aria-label="Choose your hero">
        <h2>Your hero</h2>
        <div class="carousel-heading"><strong id="name-you">Loading hero...</strong><small id="chapter-you"></small></div>
        <div class="carousel" id="carousel-you">
          <button class="carousel-arrow previous" id="previous-you" type="button" aria-label="Previous hero">&#8592;</button>
          <div class="carousel-viewport" id="viewport-you"><div class="carousel-track" id="list-you"></div></div>
          <button class="carousel-arrow next" id="next-you" type="button" aria-label="Next hero">&#8594;</button>
        </div>
        <div class="deck-preview" id="preview-you" aria-live="polite"></div>
      </section>
      <section class="hero-picker" id="picker-npc" aria-label="Choose the opponent's hero" hidden>
        <h2>Opponent's hero</h2>
        <div class="carousel-heading"><strong id="name-npc">Loading hero...</strong><small id="chapter-npc"></small></div>
        <div class="carousel" id="carousel-npc">
          <button class="carousel-arrow previous" id="previous-npc" type="button" aria-label="Previous hero">&#8592;</button>
          <div class="carousel-viewport" id="viewport-npc"><div class="carousel-track" id="list-npc"></div></div>
          <button class="carousel-arrow next" id="next-npc" type="button" aria-label="Next hero">&#8594;</button>
        </div>
        <div class="deck-preview" id="preview-npc" aria-live="polite"></div>
      </section>
    </div>
    <section id="selection-summary" hidden aria-live="polite">
      <h2>Selected heroes</h2>
      <p><strong>You:</strong> <span id="selected-you"></span></p>
      <p><strong>Opponent:</strong> <span id="selected-npc"></span></p>
      <button id="change-you" type="button">Change your hero</button>
      <button id="change-npc" type="button">Change opponent</button>
    </section>
    <button id="start" disabled>Start game</button>
  </main>

  <dialog id="equip">
    <form method="dialog" id="equip-form">
      <h2>Choose your equipment</h2>
      <div id="equip-groups"></div>
      <button id="equip-go" value="go">Deal cards</button>
    </form>
  </dialog>

  <dialog id="deck-list">
    <section class="deck-list-panel">
      <header class="deck-list-header">
        <h2 id="deck-list-title">Deck list</h2>
        <button id="deck-list-back" type="button">Back</button>
      </header>
      <div id="deck-list-cards" class="deck-list-cards"></div>
    </section>
  </dialog>

  <dialog id="card-preview" class="card-preview">
    <div class="card-preview-content">
      <button id="card-preview-back" type="button">Close preview</button>
      <img id="card-preview-image" alt="">
      <strong id="card-preview-name"></strong>
      <small id="card-preview-type"></small>
    </div>
  </dialog>

  <div id="hud" hidden></div>
  <button id="quit" hidden>Back to menu</button>
  <div id="stage" hidden></div>
  <div id="initiative-status" hidden aria-live="polite"></div>

  <script type="module" src="./script/main.js"></script>
</body>
</html>
